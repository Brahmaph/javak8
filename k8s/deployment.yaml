apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-k8s-demo

spec:

  replicas: 2

  selector:
    matchLabels:
      app: java-k8s-demo

  template:

    metadata:
      labels:
        app: java-k8s-demo

    spec:

      containers:

        - name: java-k8s-demo

          image: YOUR_DOCKERHUB_USERNAME/java-k8s-demo:v1

          ports:
            - containerPort: 8080

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "512Mi"
              cpu: "500m"